  <!-- Clawd v2 dizzy: 4 s loop at 8 fps (32 frames). Same beats as clawd-dizzy.svg: x eyes, the body sways from the feet (done as a stepped lean, no rotation), three stars orbit the head on a 3 s ellipse (three sizes fake the depth). -->
