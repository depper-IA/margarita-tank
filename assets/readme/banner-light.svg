<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Clawdy: un acuario de escritorio para tus sesiones de Claude Code">
<title>Clawdy</title>
<defs>
<style>
.h{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;letter-spacing:-0.035em;fill:#0a0a0a}
